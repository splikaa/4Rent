<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./4rent-icon.ico" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="4Rent" />
    <title>4Rent Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes _4rPulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes _4rSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body class="bg-[#0B0E14] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root">
      <div style="min-height:100vh;width:100%;background:#090d14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:'Inter',sans-serif;color:#f8fafc;">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <div style="position:absolute;inset:-6px;border-radius:28px;border:2px solid rgba(245,158,11,0.28);border-top-color:#f59e0b;animation:_4rSpin 1.4s linear infinite;"></div>
          <div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(145deg,#192130,#0f1520);border:1px solid rgba(245,158,11,0.35);display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px rgba(245,158,11,0.22);animation:_4rPulse 2s ease-in-out infinite;">
            <span style="font-size:32px;font-weight:900;color:#f59e0b;letter-spacing:-1px;">4R</span>
          </div>
        </div>
        <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">4Rent Management System</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Initializing Secure Property &amp; Sub-Meter Engine...</div>
      </div>
    </div>
  </body>
</html>
